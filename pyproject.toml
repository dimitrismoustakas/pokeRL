[project]
name = "pokerl"
version = "0.1.0"
description = "Reinforcement learning agent for Pokemon Showdown doubles battles"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "poke-env>=0.7",
    "gymnasium>=0.29",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
