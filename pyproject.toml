[project]
name = "pokerl"
version = "0.1.0"
description = "Reinforcement learning agent for Pokemon Showdown doubles battles"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.11,<3",
    "poke-env>=0.15,<0.16",
    "gymnasium>=0.29",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pokerl*"]
